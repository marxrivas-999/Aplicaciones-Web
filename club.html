<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranger Things - Club Helfire</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&family=Special+Elite&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <header>
    <nav class="menu">
      <a class="logo" href="index.html">Stranger Things</a>
      <ul class="enlaces">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="personajes.html">Personajes</a></li>
        <li><a href="temporadas.html" >Temporadas</a></li>
        <li><a href="mundos.html" >Mundos</a></li>
        <li><a href="club.html" class="activo">Club</a></li>
      </ul>
    </nav>
  </header>
<div class="luces">
    <span class="rojo"></span>
    <span class="naranja"></span>
    <span class="amarillo"></span>
    <span class="verde"></span>
    <span class="azul"></span>
    <span class="morado"></span>
    <span class="rosa"></span>
    <span class="rojo"></span>
    <span class="naranja"></span>
    <span class="amarillo"></span>
    <span class="verde"></span>
    <span class="azul"></span>
    <span class="morado"></span>
    <span class="rosa"></span>
  </div>
  <main>
        <section class="encabezado">
      <h1 class="titulo">Club Hellfire</h1>
      <p>Llena el formulario y consigue tu carnet de fan.</p>
    </section>

    <section class="seccion">
      <div class="container">
        <div class="row">
          <div class="col-lg-7">
            <h2 class="titulo-seccion">Registro de fans</h2>
            <form id="formulario-club">
              <div class="row">
                <div class="col-md-6">
                  <label for="nombre">Nombre completo</label>
                  <input type="text" id="nombre" class="caja" placeholder="Ej. Dustin Henderson" required minlength="3">
                  <p id="error-nombre" class="error"></p>
                </div>
                <div class="col-md-6">
                  <label for="correo">Correo electrónico</label>
                  <input type="email" id="correo" class="caja" placeholder="tucorreo@ejemplo.com" required>
                  <p id="error-correo" class="error"></p>
                </div>
                <div class="col-md-6">
                  <label for="edad">Edad</label>
                  <input type="number" id="edad" class="caja" min="10" max="99" placeholder="10 a 99" required>
                  <p id="error-edad" class="error"></p>
                </div>
                <div class="col-md-6">
                  <label for="personaje">Personaje favorito</label>
                  <select id="personaje" class="caja" required>
                    <option value="">Elige uno...</option>
                    <option value="mike">Mike Wheeler</option>
                    <option value="eleven">Eleven</option>
                    <option value="dustin">Dustin Henderson</option>
                    <option value="lucas">Lucas Sinclair</option>
                    <option value="will">Will Byers</option>
                    <option value="max">Max Mayfield</option>
                    <option value="holly">Holly Wheeler</option>
                    <option value="erica">Erica Sinclair</option>
                    <option value="nancy">Nancy Wheeler</option>
                    <option value="jonathan">Jonathan Byers</option>
                    <option value="steve">Steve Harrington</option>
                    <option value="robin">Robin Buckley</option>
                    <option value="eddie">Eddie Munson</option>
                    <option value="hopper">Jim Hopper</option>
                    <option value="joyce">Joyce Byers</option>
                    <option value="murray">Murray Bauman</option>
                    <option value="vecna">Vecna</option>
                    <option value="mindflayer">Mind Flayer</option>
                    <option value="demogorgon">Demogorgon</option>
                    <option value="brenner">Dr. Brenner</option>
                    <option value="kay">Dra. Kay</option>
                  </select>
                  <p id="error-personaje" class="error"></p>
                </div>
                <div class="col-md-6">
                  <label for="temporada">Temporada favorita</label>
                  <select id="temporada" class="caja" required>
                    <option value="">Elige una...</option>
                    <option value="Temporada 1">Temporada 1</option>
                    <option value="Temporada 2">Temporada 2</option>
                    <option value="Temporada 3">Temporada 3</option>
                    <option value="Temporada 4">Temporada 4</option>
                    <option value="Temporada 5">Temporada 5</option>
                  </select>
                  <p id="error-temporada" class="error"></p>
                </div>
                <div class="col-md-6">
                  <p class="etiqueta">Lo que más me gusta</p>
                  <label class="opcion"><input type="checkbox" name="gustos" value="Misterio"> Misterio</label>
                  <label class="opcion"><input type="checkbox" name="gustos" value="Monstruos"> Monstruos</label>
                  <label class="opcion"><input type="checkbox" name="gustos" value="Música de los 80"> Música de los 80</label>
                  <label class="opcion"><input type="checkbox" name="gustos" value="Amistad"> Amistad</label>
                </div>
                <div>
                  <label for="opinion">¿Por qué te gusta la serie?</label>
                  <textarea id="opinion" class="caja" rows="3" placeholder="Cuéntanos en pocas palabras" required minlength="10"></textarea>
                  <p id="error-opinion" class="error"></p>
                </div>
                <div>
                  <label class="opcion"><input type="checkbox" id="reglas" required> Acepto las reglas del club: respetar a los demás fans y no hacer spoilers.</label>
                  <p id="error-reglas" class="error"></p>
                </div>
                <div>
                  <button type="submit" class="boton-rojo">Unirme al club</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="pie">
    <div class="container d-flex justify-content-between">
      <p>Proyecto de Stranger Things</p>
      <p>Dulce María Rivas Capetillo</p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="funciones.js"></script>
</body>
</html>
